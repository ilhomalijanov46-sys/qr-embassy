<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020303">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Embassy of Burgers</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #020303;
      --gold: #E0C89B;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--ink);
      color: var(--gold);
      font-family: Manrope, system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100dvh;
      height: 100dvh;
      touch-action: manipulation;
    }

    .stage {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      padding:
        max(20px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(100%, 340px);
      gap: clamp(18px, 3.6vh, 28px);
    }

    .logo {
      display: block;
      width: min(46vw, 168px);
      height: auto;
      max-height: 32dvh;
      object-fit: contain;
      animation: fade 420ms ease both;
    }

    .copy {
      text-align: center;
      animation: fade 420ms ease 80ms both;
    }

    .copy h1 {
      margin: 0;
      font-size: clamp(18px, 4.4vw, 22px);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    .actions {
      display: flex;
      flex-direction: column;
      width: 100%;
      gap: 10px;
      animation: fade 420ms ease 140ms both;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 52px;
      padding: 0 20px;
      border: 0;
      border-radius: 0;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 160ms ease, color 160ms ease, opacity 160ms ease;
    }

    .btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .btn--gold {
      background: var(--gold);
      color: var(--ink);
    }

    .btn--line {
      min-height: 46px;
      background: transparent;
      color: var(--gold);
      font-size: 14px;
      font-weight: 500;
      box-shadow: inset 0 0 0 1.5px var(--gold);
    }

    .btn:active {
      opacity: 0.82;
    }

    .btn--gold:hover {
      background: #ead4ae;
    }

    .btn--line:hover {
      background: var(--gold);
      color: var(--ink);
    }

    .btn:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (orientation: landscape) and (max-height: 500px) {
      .card {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        width: auto;
        max-width: 640px;
        gap: 20px 32px;
      }

      .logo {
        width: min(22vw, 132px);
        max-height: 64dvh;
      }

      .copy {
        flex: 1 1 180px;
        text-align: left;
      }

      .actions {
        flex: 1 1 220px;
        width: min(100%, 240px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo, .copy, .actions { animation: none; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="card">
      <img class="logo" src="logo.svg" alt="Embassy of Burgers" width="200" height="240">

      <div class="copy">
        <h1>Спасибо, что были с нами!</h1>
      </div>

      <nav class="actions" aria-label="Заказ и соцсети">
        <a class="btn btn--gold" href="https://t.me/burgerembassy_uzbot?start=receipt">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M21.5 4.6 18.7 19c-.2 1-1.4 1.4-2.3.8l-4.8-3.6-2.3 2.3c-.3.3-.7.4-1 .2l.4-4.9L18.2 7c.4-.3 0-.5-.5-.2L7.3 13.4 2.6 12c-1-.3-1-1.2.2-1.8l17.4-6.7c.9-.4 1.8.3 1.3 1.1Z" fill="currentColor"/>
          </svg>
          Заказать снова
        </a>
        <a class="btn btn--line" href="https://www.instagram.com/burgerembassyuz/">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="12" cy="12" r="4.1" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="17.3" cy="6.7" r="1" fill="currentColor"/>
          </svg>
          Меню и новинки
        </a>
      </nav>
    </section>
  </main>
</body>
</html>
