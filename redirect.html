<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020303">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Embassy of Burgers</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #020303;
      --gold: #E0C89B;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--ink);
      color: var(--gold);
      font-family: Manrope, system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100dvh;
      height: 100dvh;
      touch-action: manipulation;
    }

    .stage {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      padding:
        max(24px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(28px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(100%, 360px);
      gap: clamp(28px, 5vh, 40px);
    }

    .logo {
      display: block;
      width: min(58vw, 200px);
      height: auto;
      max-height: 42dvh;
      object-fit: contain;
    }

    .actions {
      display: flex;
      flex-direction: column;
      width: 100%;
      gap: 10px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 52px;
      padding: 0 20px;
      border: 0;
      border-radius: 0;
      text-decoration: none;
      letter-spacing: 0.04em;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 160ms ease, color 160ms ease, opacity 160ms ease;
    }

    .btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .btn--gold {
      background: var(--gold);
      color: var(--ink);
    }

    .btn--line {
      background: transparent;
      color: var(--gold);
      box-shadow: inset 0 0 0 1.5px var(--gold);
    }

    .btn:active {
      opacity: 0.82;
    }

    .btn--gold:hover {
      background: #ead4ae;
    }

    .btn--line:hover {
      background: var(--gold);
      color: var(--ink);
    }

    .btn:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    @media (orientation: landscape) and (max-height: 500px) {
      .card {
        flex-direction: row;
        width: auto;
        max-width: 100%;
        gap: 36px;
      }

      .logo {
        width: min(28vw, 160px);
        max-height: 72dvh;
      }

      .actions {
        width: 240px;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="card">
      <img class="logo" src="logo.svg" alt="Embassy of Burgers" width="200" height="240">

      <nav class="actions" aria-label="Embassy contacts">
        <a class="btn btn--gold" href="https://t.me/burgerembassy_uzbot">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M21.5 4.6 18.7 19c-.2 1-1.4 1.4-2.3.8l-4.8-3.6-2.3 2.3c-.3.3-.7.4-1 .2l.4-4.9L18.2 7c.4-.3 0-.5-.5-.2L7.3 13.4 2.6 12c-1-.3-1-1.2.2-1.8l17.4-6.7c.9-.4 1.8.3 1.3 1.1Z" fill="currentColor"/>
          </svg>
          Telegram
        </a>
        <a class="btn btn--line" href="https://www.instagram.com/burgerembassyuz/">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="12" cy="12" r="4.1" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="17.3" cy="6.7" r="1" fill="currentColor"/>
          </svg>
          Instagram
        </a>
      </nav>
    </section>
  </main>
</body>
</html>
